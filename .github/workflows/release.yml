# Build di rilascio: a ogni tag "v*" (es. v1.2.3) compila l'APK firmato e lo pubblica
# in una Release di GitHub.
#
# Secrets richiesti (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   RELEASE_KEYSTORE_BASE64 (il file .jks in base64), RELEASE_KEYSTORE_PASSWORD,
#   RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versione dal tag
        run: |
          VERSIONE="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSIONE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Il tag deve essere del tipo v1.2.3 (ricevuto: $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "VERSION_NAME=$VERSIONE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"

      - name: Keystore di firma
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test e build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano i secrets SUPABASE_URL / SUPABASE_ANON_KEY"
            exit 1
          fi
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="GestioneTurni-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Gestione Turni $VERSION_NAME" \
            --generate-notes
